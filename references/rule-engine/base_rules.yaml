# base_rules.yaml — 基础层基因文件（所有教材的「源基因」）
# 权威源：references/rule-engine/base_rules.yaml | 版本: v1.8 | 日期: 2026-08-08
# 变更: v1.8新增PART4-P-Layer感知层+C-Layer坍缩层+4R知识打磨+SoT-BoT+对抗三角自检(系统级)；v1.7新增proofread_protocol+consolidate_protocol；v1.6新增遗传变异机制顶层设计同步；v1.5新增auto_propagation_policy
# 继承语义：
#   inherit: 直接复制，不允许覆盖
#   override: Bootstrap时实例化填充，允许章节覆盖
#   extend: Bootstrap时可扩展，章节可追加

schema_version: "v1.0"
extends_ref: null   # base_rules.yaml 是根基因，无上游

# ═══════════════════════════════════════════════════════════
# PART 0: 目录约定（教材层四目录标准命名）
# ═══════════════════════════════════════════════════════════
directory_conventions:
  inherit: "override"          # Bootstrap时可按tb_实例适配，改动作用域仅限WORK_ROOT
  scoped_to: "WORK_ROOT"       # 各tb_目录独立实例化，互不影响
  description: "教材层四目录标准命名。Bootstrap工具可在tb_实例内修改，但系统层源文件不受影响。"
  dirs:
    base_rules:       "00-系统规则"    # 继承自系统层00-系统规则/base_rules.yaml的规则副本
    intake:           "01-任务摄入"    # 原始素材、样张、用户输入
    textbook_rules:   "00-教材规则"    # 教材实例规则（textbook_rules.yaml所在层）
    runtime_state:    "03-运行状态"    # 运行日志、bootstrap进度、编排状态

# ═══════════════════════════════════════════════════════════
# PART 1: 通用不变基因（所有层级共享，不可覆写）
# ═══════════════════════════════════════════════════════════
universal_genes:
  description: "所有教材层级共享，不可覆写"
  genes:
    state_machine:
      inherit: "fixed"
      value:
        - BOOTSTRAP
        - INTAKE
        - CLARIFY
        - SPECIFY
        - RETRIEVE
        - PRODUCE
        - VERIFY
        - PROOFREAD
        - CONSOLIDATION
        - VISUALIZE
        - ASSEMBLE
        - DELIVER
        - LEARN
    sat_protocol:
      inherit: "fixed"
      value:
        confidence_threshold: 90
        max_rounds: 5
        max_questions_per_round: 5
    agent_team:
      inherit: "fixed"
      value:
        - tb-chief-editor
        - tb-writer
        - tb-educator
        - tb-reviewer
        - tb-researcher
        - tb-didactic-planner
        - tb-visual-designer
    review_rounds:
      inherit: "fixed"
      value:
        vocational: 3
        associate: 4
        bachelor: 5
        graduate: 5

# ═══════════════════════════════════════════════════════════
# PART 2: 可变参数基因（Bootstrap时实例化，允许章节覆盖）
# ═══════════════════════════════════════════════════════════
variable_genes:
  description: "Bootstrap时从level_presets填充，允许章节通过_local_overrides覆盖"
  genes:
    word_target:
      inherit: "override"
      default_source: "level_presets.yaml"
      field_path: "quality.word.target"
      type: integer
      unit: "中文字"
    word_tolerance:
      inherit: "override"
      default_source: "level_presets.yaml"
      field_path: "quality.word.tolerance"
      type: string
    min_figures:
      inherit: "override"
      default_source: "level_presets.yaml"
      field_path: "quality.figures.min_per_chapter"
      type: integer
    min_questions:
      inherit: "override"
      default_source: "level_presets.yaml"
      field_path: "quality.questions.min_per_chapter"
      type: integer
    review_required:
      inherit: "override"
      default_source: "level_presets.yaml"
      field_path: "workflow.review.required"
      type: boolean
    sizheng_mode:
      inherit: "override"
      default_source: "level_presets.yaml"
      field_path: "sizheng.mode"
      type: string
    sizheng_max_ratio:
      inherit: "override"
      default_source: "level_presets.yaml"
      field_path: "sizheng.max_ratio"
      type: float
    structure:
      inherit: "override"
      default_source: "level_presets.yaml"
      field_path: "structure"
      type: list

# ═══════════════════════════════════════════════════════════
# PART 3: 层级差异基因（四档预设，运行时按depth_level选取）
# ═══════════════════════════════════════════════════════════
# ⚠️ 详细参数见 references/rule-engine/level_presets.yaml
# 此处仅定义引用关系，不内嵌完整参数（避免重复维护）
level_differential_genes:
  description: "四档预设参数，详见level_presets.yaml（整合源）"
  ref: "level_presets.yaml"
  levels:
    vocational:
      ref: "level_presets.yaml#vocational"
    associate:
      ref: "level_presets.yaml#associate"
    bachelor:
      ref: "level_presets.yaml#bachelor"
    graduate:
      ref: "level_presets.yaml#graduate"

# ═══════════════════════════════════════════════════════════
# PART 4: 能力包注册（Bootstrap时激活，可细粒度覆写）
# ═══════════════════════════════════════════════════════════
# ⚠️ 详细配置见 references/rule-engine/skill_registry.yaml
capability_packages:
  description: "教材层级对应的能力包配置，详见skill_registry.yaml"
  ref: "skill_registry.yaml"

# ═══════════════════════════════════════════════════════════
# PART 5: Review路由参数（可被教材层覆写）
# ═══════════════════════════════════════════════════════════
review_routing:
  description: "tb-reviewer三策略路由阈值，可被textbook_rules.yaml覆写"
  thresholds:
    full_review_max: 10000       # ≤10K字：全量审查
    summary_first_max: 25000    # 10K-25K字：摘要优先
  chunk_size:
    target: 6000               # 目标块大小（中文字）
    max: 8000                  # 上限
    boundary_preference:        # 切分优先级
      - "## 二级标题"
      - "### 三级标题"
      - "段落边界"
  combination_trigger:
    pending_evidence_min: 5    # pending>5触发组合策略
    content_score_max: 70      # content<70触发组合策略
  routing_trigger: "chief-editor委派时决策，携带策略选择理由"

# ═══════════════════════════════════════════════════════════
# PART 7: 知识接口标准（knowledge_scope — 工具×教材的标准接口）
# ═══════════════════════════════════════════════════════════
# 【v2.0新增】解决工具层×教材层耦合问题
#
# 设计原则：
#   工具 = 执行器（无域知识，只读规则）
#   教材层 = 知识库（填充具体知识，供工具读取）
#   两者通过 knowledge_scope 正交组合
#
# 参数解析优先级（运行时）：
#   chapter_rules.yaml > textbook_rules.yaml > base_rules.yaml
#
# 扩展新领域时：
#   只需在 textbook_rules.yaml 填充 knowledge_scope（B1：字段名统一，原 knowledge_instance 废弃），
#   工具层无需任何修改。
# ═══════════════════════════════════════════════════════════

knowledge_scope_schema:
  description: "知识接口标准 — 所有教材必须实现的知识域参数"
  version: "v1.0"
  source: "base_rules.yaml"
  usage: |
    工具（如tb-researcher/tb-writer/expert-pool）在执行时通过 rules_resolver 读取：
      resolver.resolve("knowledge_scope.diseases")
      resolver.resolve("knowledge_scope.expert_keywords.病原学")
    工具本身不硬编码任何具体疾病名/URL/关键词。

  # ── 子字段定义 ─────────────────────────────────────
  fields:

    # 【必填】疾病/主题名称列表
    # 工具通过此字段知道"本教材涉及哪些疾病"
    # 例如 {{example_diseases}}
    # 例如 {{example_topics}}
    diseases:
      type: list[string]
      required: true
      description: "本教材涉及的疾病名称列表（由knowledge_scope.diseases填充）"
      tool_usage: "tb-researcher检索、expert-pool角色激活、污染检测"

    # 【可选】非疾病类主题列表（由knowledge_scope.topics填充）
    # diseases和topics互斥，工具根据哪个非空来判断教材类型
    topics:
      type: list[string]
      required: false
      description: "本教材涉及的主题/概念列表（非疾病类教材，由knowledge_scope.topics填充）"
      tool_usage: "专家角色激活、检索关键词生成"

    # 【必填】病原/病理/药理等专有名称
    # 例如 {{example_pathogens}}
    pathogens:
      type: list[string]
      required: true
      description: "本教材涉及的病原体/生物制剂名称"
      tool_usage: "tb-researcher检索、专家角色keywords匹配"

    # 【必填】专家角色匹配关键词
    # 用于 CONTENT_AWARE 角色动态激活
    # 结构: category → keywords[]
    # category = 病原学/临床诊断/实验室诊断/流行病学/生物安全/药政合规/公共卫生 等
    expert_keywords:
      type: map           # 本字段为 map（key=category类别名，value=关键词列表）
      category_type: list[string]   # map 的 value 类型：字符串列表
      required: true
      description: "用于激活 CONTENT_AWARE 角色的关键词映射（通用概念，非具体疾病名）"
      example:
        病原学: [病毒, 变异, 抗原漂移, HA, NA, ICTV, 基因型, 亚型]
        临床诊断: [呼吸道, 产蛋下降, 神经症状, 粪便异常, 死亡]
        实验室诊断: [PCR, RT-PCR, HI, ELISA, 病毒分离, 荧光定量]
        流行病学: [传播, 宿主, 媒介, R0, 疫点, 疫区]
        生物安全: [消毒, 隔离, 全进全出, 免疫程序]
        药政合规: [兽药典, 休药期, 残留限量, 注册疫苗]
        公共卫生: [人兽共患, 跨种传播, 食品安全, OneHealth]
      tool_usage: "expert-pool.yaml CONTENT_AWARE 角色激活"

    # 【必填】权威参考网站
    # 工具通过此列表生成检索策略
    reference_sources:
      type: list[map{name, url, description}]
      required: true
      description: "本领域权威参考网站列表（用于tb-researcher生成检索策略）"
      example:
        - name: "FAO EMPRES-i"
          url: "https://empres-i.apps.fao.org/"
          description: "FAO全球疫病监测数据库"
      tool_usage: "tb-researcher.md 生成检索URL列表"

    # 【必填】领域特异性检索词
    # 结构: source → keyword_string
    # source = moa/cnki/pubmed/google/wos 等
    retrieval_keywords:
      type: map           # 本字段为 map（key=source来源，value=检索关键词字符串）
      source_type: string         # map 的 key 类型
      required: true
      description: "本领域特异性检索关键词（用于联网检索）"
      example:  # 示例值由 domain profile 注入; 此处为结构演示（不含任何学科专用值）
        moa: "site:moa.gov.cn {{retrieval_keywords.moa}} 2024"
        pubmed: "{{retrieval_keywords.pubmed}}"
        cnki: "{{retrieval_keywords.cnki}}"
      tool_usage: "tb-researcher.md 生成mcp__tavily-search调用"

    # 【可选】教学示例数据
    # 用于 tb-educator 生成图表示例（通用格式模板，本域填入具体值）
    teaching_examples:
      type: map
      required: false
      description: "用于生成教学示例的样本数据"
      subfields:
        disease_comparison_template:
          type: string
          description: "疾病比较表通用模板（工具渲染时填入具体疾病数据）"
          tool_usage: "tb-educator.md GFM表格生成"
        case_study_template:
          type: string
          description: "案例分析STAR格式模板"
          tool_usage: "tb-writer.md 案例生成"
        domain_query_example:
          type: string
          description: "检索示例问句模板"
          tool_usage: "tb-reviewer.md 检索任务描述"

    # 【必填】污染检测模式（用于rule-sync-check hook）
    # 检测到以下内容出现在基础层工具文件中 = 教材层污染信号
    pollution_pattern:
      type: list[string]
      required: true
      description: "污染检测关键词列表（用于识别教材内容污染基础层）"
      example: ['{{diseases[0]}}', '{{diseases[1]}}', '{{diseases[2]}}']
      tool_usage: "rule-sync-check.sh DISEASE_PATTERN 变量"

    # 【可选】章节能力声明（用于工具层条件分支）
    # 本字段驱动 tb-golden-textbook 等 Skill 的加载决策
    # C1 Bootstrap 时根据章节类型自动推断（鉴别诊断章节→full，概论章节→none，普通章节→partial）
    capabilities:
      type: map
      required: false
      description: "章节能力声明——控制 Skill 加载行为和内容渲染范围"
      subfields:
        differential_diagnosis:
          type: enum[full|partial|none]
          default: none
          description: "鉴别诊断内容加载级别"
          inference_rule: |
            C1 Bootstrap 自动推断规则：
            - 章节标题含"鉴别"→ "full"
            - 章节标题含"诊断"/"防控"/"案例"→ "partial"
            - 其他 → "none"
          tool_usage: "tb-golden-textbook SKILL.md 加载 differential-structure.md + domain/{学科}/differential-data.md"
        case_study:
          type: enum[full|partial|none]
          default: partial
          description: "案例学习内容加载级别"
          tool_usage: "tb-writer.md STAR案例生成"
        retrieval:
          type: enum[wiki_first|web_first|none]
          default: wiki_first
          description: "检索策略偏好"
          tool_usage: "tb-researcher.md 检索顺序"
        pathology:
          type: enum[full|partial|none]
          default: partial
          description: "病变描述内容加载级别"
          tool_usage: "tb-golden-textbook references/__framework__/pathology-checklist.md"

    # 【可选】命名规范示例（用于naming-check hook）
    naming_examples:
      type: list[string]
      required: false
      description: "本领域文件命名示例（hook输出给用户看的提示）"
      example:  # 命名示例由 domain profile 注入; 此处为结构演示（不含任何学科专用值）
        - "第3章-{{disease_name}}的诊断与治疗要点总结.md"
        - "03-{{disease_name}}诊断要点.md"
      tool_usage: "naming-check.sh 错误提示示例"

# ═══════════════════════════════════════════════════════════
# PART 8: 工具元数据注册表（运行时参数绑定说明）
# ═══════════════════════════════════════════════════════════
tool_binding:
  description: "工具 × 知识接口的运行时绑定关系"
  version: "v1.0"
  source: "base_rules.yaml"

  bindings:
    - tool: "expert-pool.yaml"
      model: "read_resolved"
      reads:
        - path: "knowledge_scope.expert_keywords"
          layer: "chapter_rules"
          required: true
      note: "CONTENT_AWARE角色按keywords匹配，工具不硬编码任何具体关键词"

    - tool: "tb-researcher.md"
      model: "read_resolved"
      reads:
        - path: "knowledge_scope.reference_sources"
          layer: "textbook_rules"
          required: true
        - path: "knowledge_scope.retrieval_keywords"
          layer: "textbook_rules"
          required: true
        - path: "knowledge_scope.pathogens"
          layer: "chapter_rules"
          required: true
      note: "检索时从规则文件读取URL和关键词，不硬编码FAO/MOA等具体网站"

    - tool: "tb-educator.md"
      model: "read_resolved"
      reads:
        - path: "knowledge_scope.diseases"
          layer: "chapter_rules"
          required: true
        - path: "knowledge_scope.teaching_examples"
          layer: "chapter_rules"
          required: false
      note: "图表示例从teaching_examples读取，不硬编码任何具体疾病名（domain profile 提供）"

    - tool: "tb-writer.md"
      model: "read_resolved"
      reads:
        - path: "knowledge_scope.diseases"
          layer: "chapter_rules"
          required: true
        - path: "knowledge_scope.teaching_examples.domain_query_example"
          layer: "chapter_rules"
          required: false
      note: "写作示例从规则文件读取，不硬编码具体疾病名"

    - tool: "tb-reviewer.md"
      model: "read_resolved"
      reads:
        - path: "knowledge_scope.diseases"
          layer: "chapter_rules"
          required: true
        - path: "quality.writing.ai_voice_banned"
          layer: "base_rules"
          required: true
      note: "检索任务示例从规则读取，不硬编码具体疾病名称"

    - tool: "rule-sync-check.sh"
      model: "env_var"
      reads:
        - path: "knowledge_scope.pollution_pattern"
          layer: "textbook_rules"
          env_var: "DISEASE_PATTERN"
      note: "Hook从环境变量读取污染检测模式，不在脚本中硬编码疾病名"

    - tool: "naming-check.sh"
      model: "comment_hint"
      reads:
        - path: "knowledge_scope.naming_examples"
          layer: "textbook_rules"
      note: "Hook注释中标注'详见 textbook_rules.yaml#knowledge_scope.naming_examples'"
inheritance_protocol:
  bootstrap_flow: "base_rules.yaml → textbook_rules.yaml → chapter_rules.yaml"
  merge_priority:
    - "chapter_rules.yaml._local_overrides > textbook_rules.yaml > base_rules.yaml"
    - "chapter_rules.yaml._local_overrides 覆盖 variable_genes 和 level_differential_genes"
    - "universal_genes 不允许任何层级覆盖"
  path_resolution:
    refs_relative_to: "references/rule-engine/"
    bootstrap_resolves_to: "00-教材规则/textbook_rules.yaml"
    chapter_resolves_to: "章节/ch_XX/chapter_rules.yaml"
  overrides_mechanism:
    description: "章节覆盖variable_genes时，写入chapter_rules.yaml._local_overrides"
    example: |
      _local_overrides:
        word_target: 18700    # 覆盖蓝图字数
        min_figures: 13      # 覆盖图表数量

  # ═══════════════════════════════════════════════════════════════
  # 字段继承类型语义表（v1.4 新增，整合 archive/standalone/12-遗传协议.md）
  # ═══════════════════════════════════════════════════════════════
  field_inheritance_types:
    description: "chapter_rules.yaml 声明每个字段的继承类型，决定其是否可被覆盖"
    # 有则改之，无则加勉：override字段在父层有值则继承，父层无值或章节需调整时覆盖
    # extend字段在父层有值时合并去重追加，父层无值时以章节级值初始化
    # inherit_only字段：无论父层是否有值，章节级必须严格继承，不得新增或修改
    types:
      - type: "override"
        semantics: "Bootstrap时从level_presets填充，允许章节通过_local_overrides覆盖"
        example_fields: ["word_target", "word_tolerance", "min_figures", "min_questions", "review_required", "sizheng_mode", "sizheng_max_ratio"]
        overridable: true
      - type: "inherit_only"
        semantics: "仅从教材层继承，章节禁止覆写"
        example_fields: ["structure", "allowed_files"]
        overridable: false
      - type: "extend"
        semantics: "可扩展，章节可在教材层基础上追加内容"
        example_fields: ["knowledge_scope", "special_requirements"]
        overridable: true
        note: "章节追加时使用章节级knowledge_scope与教材层合并，而非替换"
      - type: "fixed"
        semantics: "通用不变，基础层锁定，所有层级禁止覆写"
        example_fields: ["state_machine", "sat_protocol", "agent_team"]
        overridable: false

  # 字段映射表（base_rules → textbook_rules → level_presets.yaml → chapter_rules 链路）
  # ⚠️ 2026-04-25 更新：depth_level 在 textbook_rules.yaml 根层（不在 variable_genes）
  #    word_target/min_figures/min_questions 实际值来自 level_presets.yaml（不在 textbook defaults）
  field_mapping_table:
    description: "variable_genes 字段从根基因到章节的完整映射路径"
    mappings:
      - base_field: "variable_genes.word_target"
        textbook_field: "❌ 已在 level_presets.yaml associate.quality.word.target"
        chapter_override: "_local_overrides.word_target"
        inherit_type: "override"
      - base_field: "variable_genes.depth_level"
        textbook_field: "textbook_rules.yaml#depth_level（根层）"
        chapter_override: "_local_overrides.depth_level"
        inherit_type: "override"
      - base_field: "variable_genes.min_figures"
        textbook_field: "❌ 已在 level_presets.yaml associate.quality.figures.min_per_chapter"
        chapter_override: "_local_overrides.min_figures"
        inherit_type: "override"
      - base_field: "variable_genes.min_questions"
        textbook_field: "❌ 已在 level_presets.yaml associate.quality.questions.min_per_chapter"
        chapter_override: "_local_overrides.min_questions"
        inherit_type: "override"
      - base_field: "variable_genes.structure"
        textbook_field: "defaults.writing.structure"
        chapter_override: "❌ 不可覆写"
        inherit_type: "inherit_only"
      - base_field: "level_differential_genes"
        textbook_field: "workflow.review.min_rounds"
        chapter_override: "_local_overrides.min_rounds"
        inherit_type: "override"

  # 向后兼容约定（处理旧章节的缺失字段）
  backward_compatibility:
    description: "旧章节（v5.0前）的字段缺失时的默认行为"
    scenarios:
      - scenario: "旧章节无inherited_from字段"
        fallback: "假定继承textbook_rules.yaml#v5.0，正常运行"
      - scenario: "旧章节无field_types声明"
        fallback: "假定全部字段为inherit_only（不覆写）"
      - scenario: "旧章节有重复声明值（非_local_overrides）"
        fallback: "值与_local_overrides等效，行为不变"
      - scenario: "depth_level字段缺失"
        fallback: "默认为associate（职业本科）"

  # tb-chapter-bootstrap 声明式继承机制
  chapter_bootstrap_inheritance:
    description: "tb-chapter-bootstrap生成chapter_rules.yaml时的声明式继承模式"
    schema_example: |
      schema_version: "v5.0"
      inherited_from: "00-教材规则/textbook_rules.yaml#v5.0"

      field_types:
        word_target: override         # ← 可覆写
        structure: inherit_only       # ← 不可覆写
        knowledge_scope: extend       # ← 可追加

      _local_overrides:
        word_target: 18700           # ← ch_XX具体值
        min_figures: 13              # ← ch_XX图表数
    runtime_resolution: "Agent启动时读取inherited_from → 追踪到textbook_rules.yaml → 获取defaults → 应用_local_overrides覆盖"

  # 能力包激活链路（v1.4 新增）
  capability_activation_chain:
    description: "从level_presets到Agent行为参数的完整链路"
    flow: |
      skill_registry.yaml[depth_level]
          ↓ activated skills 列表
      textbook_rules.yaml.resources.skills
          ↓ chief-editor委派时查询
      chapter_rules.yaml.knowledge_scope
          ↓ 运行时读取
      Agent启动时应用对应行为参数
    note: "详见 skill_registry.yaml 和 base_rules.yaml#capability_packages"

  # 自动遗传同步策略（v1.5 新增）
  auto_propagation_policy:
    description: "规则文件变更的自动遗传同步策略"
    layers:
      base_to_textbook:
        trigger: "base_rules.yaml 或 level_presets.yaml 或 skill_registry.yaml 变更"
        action: "在教材层 01-项目日志.md 记录变更事件，等待人工确认同步到 textbook_rules.yaml"
        auto: false  # 基础层变更需要人工确认
        notification: "在 01-项目日志.md 追加变更事件，包含：变更文件、变更时间、建议同步字段"
      textbook_to_chapter:
        trigger: "textbook_rules.yaml 变更"
        action: "自动同步到所有受影响章节的 _local_overrides（字段级合并，非覆盖）"
        auto: true   # 教材层→章节层可自动同步
        notification: "在章节 02-章内日志.md 记录变更事件"
    implementation:
      trigger_script: ".claude/hooks/write-guard.sh _detect_rule_propagation()"
      sync_script: ".claude/scripts/rule_sync_checker.py"
      log_file: "03-运行状态/rule_propagation_log.md"

