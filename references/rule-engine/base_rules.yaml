# === proofread_protocol（校稿协议）===
proofread_protocol:
  description: 多 Agent 协作校稿标准协议（句子级细颗粒度审阅）
  applicability: textbook project with external collaborators
  stage: PROOFREAD
  parallelizable: true  # 多章节可并行校稿

  tag_taxonomy:
    format: "[[TAG:YYYYMMDD-NNNN]]"  # UUID 全局唯一
    FIXED:
      meaning: 已修正（事实/语法/格式错误）
      requires_human_confirm: false
    GAP:
      meaning: 内容缺失（需合伙人补充）
      requires_human_confirm: true
    CONFLICT:
      meaning: 事实性冲突（禁止自动合并）
      requires_human_confirm: true
      blocks_publish: true
    STYLE:
      meaning: 风格不一致（供统稿处理）
      requires_human_confirm: false
    APPROVED:
      meaning: 合伙人已确认
      requires_human_confirm: false
    RESOLVED:
      meaning: 冲突已裁定解决
      requires_human_confirm: false

  csv_schema:
    columns: [uuid, 章节号, 节号, 原句, sentence_md5, 标签, 修正建议, 合伙人填写, 合伙人备注, 状态]
    convenience_features:
      - dropdown_options_in_partner_column
      - uuid_tracking_for_traceability
      - 核对方向引导_in_comments
    status_values: [pending, confirmed, resolved]

  stages:
    - stage: sentence_tagging
      agent: tb-reviewer (proofreading mode)
      output: annotated draft (draft_proofread.md)
    - stage: csv_generation
      agent: tb-reviewer (proofreading mode)
      output: proofread_feedback.csv
    - stage: human_confirmation
      agent: external_collaborator
      input: proofread_feedback.csv
      output: csv_with_answers
    - stage: draft_merge
      agent: tb-reviewer (proofreading mode)
      input: csv_with_answers + annotated draft
      output: proofread_merged_draft.md

  skill_location: "{{project_root}}/.claude/skills/tb-proofread/"  # 项目级 skill
  csv_template: "{{project_root}}/.claude/skills/tb-proofread/references/proofread_feedback_template.csv"

# === consolidate_protocol（统稿协议）===
consolidate_protocol:
  description: 跨章节风格统一标准协议（全局视图，串行执行）
  applicability: multi-chapter textbook project
  stage: CONSOLIDATE
  parallelizable: false  # 必须串行（全局视图）
  prerequisite:
    all_chapters_status: PROOFREAD_COMPLETE
    all_csv_confirmed: true

  dimensions:
    terminology_consistency:
      score_name: 术语一致性
      weight: 20
      min_threshold: 80
    format_consistency:
      score_name: 格式统一性
      weight: 20
      min_threshold: 75
    figure_table_continuity:
      score_name: 图表编号连续性
      weight: 20
      min_threshold: 100  # 编号冲突为硬阻塞
    content_completeness:
      score_name: 内容完整性
      weight: 20
      min_threshold: 75
    conflict_resolution_rate:
      score_name: 冲突解决率
      weight: 20
      min_threshold: 100  # CONFLICT 未解决为硬阻塞

  outputs:
    consolidated_draft: consolidated_draft.md
    terminology_report: 术语统一记录.md
    figure_table_map: figure_table_map_v{N}.md
    format_report: format_consistency_report.md
    conflict_report: conflict_report.md  # 如有冲突则必须裁定后才能发布
    style_guide_version_update: 风格规范文档版本号+0.1

  blocking_conditions:
    - unconfirmed_csv_remaining > 0
    - conflict_unresolved_count > 0
    - figure_table_numbering_conflict: true
    - consolidated_score < 80

  skill_location: "~/.hermes/skills/tb-consolidation/"  # 系统级 skill（增强版 v1.3）
  style_guide_location: "{{project_root}}/00-系统规则/风格规范文档.md"
  glossary_location: "{{project_root}}/00-系统规则/术语表.md"  # 可选，缺失则降级

# ═════════════════════════════════════════════════════════════════════
# PART 4: P-Layer 感知层 + C-Layer 坍缩层（v1.8新增）
# ═════════════════════════════════════════════════════════════════════
# P-Layer · 感知层（自动激活，输出不外显，驱动路由决策）
# ─────────────────────────────────────────────────────────────────────
# 感知扫描：用户输入进入 → SAT状态机之前执行
#   P1·领域感知    → 一级领域词（由 domain profile 提供）
#   P2·认知层级    → 操作级(<3步)/策略级(3-8步)/哲学级(≥8步)
#   P3·情绪捕捉    → 急迫/焦虑/疲惫/愤怒 → 暂停+标记后再继续
# 感知结果注入路由决策：不进入最终输出
#
# C-Layer · 坍缩层（置信度<90% 或复杂策略时激活）
# ─────────────────────────────────────────────────────────────────────
# 动态坍缩为3-5人专家团队：
#   常驻(1-2)：苏格拉底导师（追问收敛）+ 魔鬼代言人（逻辑猎手）
#   动态(2-3)：按领域激活：病毒学家/生信学家/教育学家/评审专家/认知科学家
# 专家池：
#   病毒学：{{pathogen_keywords}}（由 domain profile 提供，见 plugins/<domain>/domain-examples.yaml）
#   生信：序列/进化树/GISAID/Nextclade/NCBI
#   教学：教材/课件/学习目标/评估/Bloom
#   基金/学术：基金/SCI/审稿/职称
#   认知：认知负荷/教学策略/学习理论
# 激活链路：感知结果 → 坍缩引擎 → 组建团队 → 执行 → 团队解散
#
# 4R · 知识打磨（联网检索任务专用，tb-researcher 已嵌入）
# ─────────────────────────────────────────────────────────────────────
# Research → Reflect → Run → Refine → [最多3循环]
# Research: 检索结果相关？覆盖度够？
# Reflect:   概念清晰？证据覆盖核心？
# Run:       能形成结构化答案？
# Refine:    值得沉淀？格式规范？
# 迭代退出：4项全达标 或 达最大循环(3次)
#
# SoT-BoT · 骨架优先输出（复杂输出生成时启用）
# ─────────────────────────────────────────────────────────────────────
# 阶段1-Skeleton：输出骨架（不填充细节）
#   ## [主要结论/主题]
#   ### [支撑点A] — 概要
#   ### [支撑点B] — 概要
# 阶段2-BoT：并行填充各支撑点详细内容
# 中间推理存储在草稿buffer，不进入最终输出
#
# 对抗三角自检（tb-reviewer/大型输出任务启用）
# ─────────────────────────────────────────────────────────────────────
# 三角：生成器初稿 → 批评者三维度质疑 → 优化器精炼 → 闭环验证
#   批评三维度：逻辑漏洞 | 遗漏项 | 约束违反
#   优化器：删除装饰，补充缺口
#   闭环：批评项未清零 → 拒绝输出，返回重做
# ═════════════════════════════════════════════════════════════════════
