# PART 13: DRA 双跑冗余架构（v1.8 新增 · TD-57）
# ═════════════════════════════════════════════════════════════════════
# 强制清单：教材特化 skill（第一跑）× 通用 skill（第二跑）串行双跑
# 注入时机：Agent 启动时由 agent_phase_loader.inject_dualrun_required() 读取
# 强制执行：L3 Gate 阻断（composite-phase-gate.sh / gate-visualize.sh）
# ═════════════════════════════════════════════════════════════════════
dualrun_required:
  description: "DRA 双跑强制清单：教材特化 skill（第一跑）× 通用 skill（第二跑）"
  inherit: "fixed"
  phases:
    PRODUCE_end:
      trigger: "PRODUCE 阶段结束前"
      first: ["tb-writing-style"]
      second: ["去AI味", "humanizer-zh"]
      output: "review/dualrun_humanizer.csv"
    VISUALIZE:
      trigger: "VISUALIZE 阶段"
      first: ["tb-visual-design"]
      second: ["scientific-visualization", "baoyu-imagine"]
      output: "review/dualrun_visual.csv"
      config:
        textbook_mode: true  # 禁用 MANDATORY graphical abstract
    VERIFY_R3:
      trigger: "VERIFY R3 轮次"
      first: ["tb-evidence-anchor"]
      second: ["paper-lookup"]  # + pubmed MCP
      output: "review/evidence_chain.csv"

# ═══════════════════════════════════════════════════════════
# PART 14: 资料-审核-循环门禁配置（v1.9 新增 · TD-66 · Sub-A）
# ═══════════════════════════════════════════════════════════
retrieval_gate_config:
  description: "资料-审核-循环门禁配置（Sub-A v2.4）"
  inherit: "fixed"
  gap_approval:
    description: "缺口审批筛选（B3 缺口闭环）：writer 起草期登记的缺口须经主理人审批方可进入检索队列"
    inherit: "fixed"
    trigger: "PRODUCE 交付草稿后、进入 RETRIEVE 之前"
    ledger_path: "章节/{ch##}/gaps.md"
    tag_format: "[需补数据·{ch##}-g{NN}]"
    min_approved: 3
    max_approved: 10
    on_overflow: "按 priority 截断至上限（P0 全留），其余标 deferred（不得丢弃）"
    on_underflow: "扩批至相邻缺口；仍不足则显式标注「本轮不足 3 个」豁免"
    verdict_states: ["approved", "rejected", "deferred"]
    gap_type_ref: "references/gap-types.md"
    validator: "scripts/check_gap_flow.py"
  gate1_specify:
    description: "门禁1：SPECIFY 前，knowledge_scope 主题覆盖率 ≥ 70%"
    trigger: "chapter_spec.md 完成"
    spec_coverage_threshold: 0.70
  gate2_retrieve:
    description: "门禁2：RETRIEVE 后，资料质量三重规则"
    trigger: "retrieval/index.md 完成"
    smart_judgment:
      coverage_threshold: 0.50
      conflict_threshold: 0.30
      outdated_ratio_threshold: 0.70
      outdated_years: 5
    on_fail:
      auto_action: "loop"
      user_options: ["loop", "manual"]
    max_loop_count: 5
  triple_track_config:
    description: "三轨并行配置（manual/auto/internal）"
    tracks:
      manual:
        source: "user_input"
        priority: "override"
        weight_default: 0.9
        format: "single_file"
      auto:
        source: "4_layer_parallel"
        priority: "auto"
        weight_default: 0.6
        format: "multi_file"
      internal:
        source: "tb_<subject>/05-领域知识/"
        priority: "base"
        weight_default: 0.7
        format: "domain_kb"
    merge_strategy: "timestamp_topic_weighted"
